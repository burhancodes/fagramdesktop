name: Create Release

on:
  workflow_dispatch:
    inputs:
      tagname:
        description: "Release tag name"
        type: string
        required: true
      build_type:
        description: "Build type (ci or rel)"
        type: choice
        required: false
        default: "rel"
        options:
          - rel
          - ci
      linux_run_id:
        description: "Linux build workflow run ID"
        type: string
        required: true
      windows_run_id:
        description: "Windows build workflow run ID"
        type: string
        required: true
      mac_run_id:
        description: "macOS build workflow run ID"
        type: string
        required: true
  workflow_call:
    inputs:
      tagname:
        description: "Release tag name"
        type: string
        required: true
      build_type:
        description: "Build type (ci or rel)"
        type: string
        required: false
        default: "rel"
      linux_run_id:
        description: "Linux build workflow run ID"
        type: string
        required: true
      windows_run_id:
        description: "Windows build workflow run ID"
        type: string
        required: true
      mac_run_id:
        description: "macOS build workflow run ID"
        type: string
        required: true

permissions:
  contents: write
  actions: read

jobs:
  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    outputs:
      is_prerelease: ${{ steps.release_type.outputs.is_prerelease }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          sparse-checkout: |
            changelog.txt

      - name: Download Linux artifact
        uses: actions/download-artifact@v8
        with:
          name: fagram-${{ inputs.tagname }}
          path: artifacts/linux
          github-token: ${{ secrets.PAT || secrets.GITHUB_TOKEN }}
          run-id: ${{ inputs.linux_run_id }}

      - name: Download Windows portable artifact
        uses: actions/download-artifact@v8
        with:
          name: FAgram_Win-x64
          path: artifacts/windows
          github-token: ${{ secrets.PAT || secrets.GITHUB_TOKEN }}
          run-id: ${{ inputs.windows_run_id }}

      - name: Download Windows installer artifact
        uses: actions/download-artifact@v8
        with:
          name: FAgram_Win-x64_installer
          path: artifacts/windows-installer
          github-token: ${{ secrets.PAT || secrets.GITHUB_TOKEN }}
          run-id: ${{ inputs.windows_run_id }}

      - name: Download macOS artifact
        if: ${{ inputs.mac_run_id != '' }}
        uses: actions/download-artifact@v8
        with:
          name: fagram-mac-${{ inputs.tagname }}
          path: artifacts/mac
          github-token: ${{ secrets.PAT || secrets.GITHUB_TOKEN }}
          run-id: ${{ inputs.mac_run_id }}

      - name: List downloaded artifacts
        run: |
          echo "=== Linux artifacts ==="
          ls -la artifacts/linux/
          echo "=== Windows artifacts ==="
          ls -la artifacts/windows/
          echo "=== Windows installer artifacts ==="
          ls -la artifacts/windows-installer/
          echo "=== macOS artifacts ==="
          ls -la artifacts/mac/ 2>/dev/null || echo "(not present)"

      - name: Extract changelog for release
        run: |
          # Extract changes for the current version from changelog.txt
          awk '/^[0-9]+\.[0-9]+(\.[0-9]+)?(\s+beta)?\s*\([0-9]{2}\.[0-9]{2}\.[0-9]{2}\)/ {
            if (found) exit;
            if ($1 == "${{ inputs.tagname }}" || $1 " beta" == "${{ inputs.tagname }}") {
              found=1;
              next;
            }
          }
          found && /^-/ { print; }
          found && /^—/ { print; }' changelog.txt > body.txt

          echo "Release body:"
          cat body.txt

      - name: Build release file list
        id: release-files
        run: |
          FILES="artifacts/linux/fagram-${{ inputs.tagname }}.tar.zst
          artifacts/windows/FAgram_Win-x64_${{ inputs.tagname }}_portable.zip
          artifacts/windows-installer/*.exe"
          if [ -n "${{ inputs.mac_run_id }}" ] && [ -f "artifacts/mac/fagram-mac-${{ inputs.tagname }}.dmg" ]; then
            FILES="$FILES
          artifacts/mac/fagram-mac-${{ inputs.tagname }}.dmg"
          fi
          echo "files<<EOF" >> $GITHUB_OUTPUT
          echo "$FILES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Check release type
        id: release_type
        run: |
          IS_PRERELEASE="false"
          if [ "${{ inputs.build_type }}" = "ci" ] || [[ "${{ inputs.tagname }}" =~ (beta|alpha|dev) ]]; then
            IS_PRERELEASE="true"
          fi
          echo "is_prerelease=$IS_PRERELEASE" >> $GITHUB_OUTPUT

          if [ "$IS_PRERELEASE" = "true" ]; then
            if [[ "${{ inputs.tagname }}" =~ (beta|alpha|dev) ]]; then
              RELEASE_NAME="FAgram ${{ inputs.tagname }}"
            else
              RELEASE_NAME="FAgram ${{ inputs.tagname }} beta"
            fi
          else
            RELEASE_NAME="FAgram ${{ inputs.tagname }}"
          fi
          echo "release_name=$RELEASE_NAME" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.tagname }}
          name: ${{ steps.release_type.outputs.release_name }}
          draft: false
          prerelease: ${{ steps.release_type.outputs.is_prerelease == 'true' }}
          body_path: body.txt
          files: ${{ steps.release-files.outputs.files }}
        env:
          GITHUB_TOKEN: ${{ secrets.PAT }}

  trigger-rpm:
    name: Trigger RPM Build
    runs-on: ubuntu-latest
    needs: create-release
    if: needs.create-release.outputs.is_prerelease != 'true'
    steps:
      - name: Trigger repository dispatch event
        uses: peter-evans/repository-dispatch@v4
        with:
          token: ${{ secrets.ARPAT }}
          repository: fagramdesktop/fagram-rpm
          event-type: new-release

  update-scoop:
    name: Scoop Manifest
    needs: create-release
    if: needs.create-release.outputs.is_prerelease != 'true'
    uses: ./.github/workflows/scoop-manifest.yml
    with:
      release_tag: ${{ inputs.tagname }}
    secrets: inherit

  update-homebrew:
    name: Homebrew Cask
    needs: create-release
    if: needs.create-release.outputs.is_prerelease != 'true' && inputs.mac_run_id != ''
    uses: ./.github/workflows/homebrew-cask.yml
    with:
      release_tag: ${{ inputs.tagname }}
    secrets: inherit

  update-nix:
    name: Nix Flake
    needs: create-release
    if: needs.create-release.outputs.is_prerelease != 'true'
    uses: ./.github/workflows/nix-flake.yml
    with:
      release_tag: ${{ inputs.tagname }}
    secrets: inherit
